[package]
name = "clinrand-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for ClinRand"
publish = false

[[bin]]
name = "clinrand"
path = "src/main.rs"

[dependencies]
clinrand-core = { path = "../clinrand-core" }
clinrand-package = { path = "../clinrand-package" }
clap = { version = "=4.5.45", features = ["derive"] }
# UTC timestamp for PackageMeta.generated_at. Exact pin: clock surface.
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
# OS entropy for seed draw — only call site in workspace source. Exact pin: entropy surface.
getrandom = { version = "=0.3.4", default-features = false, features = ["std"] }
serde_json = "=1.0.151"
# Hidden-input passphrase prompts for `--encrypt` / `decrypt`. Exact pin: input surface.
rpassword = "=7.5.4"

[dev-dependencies]
clinrand-core = { path = "../clinrand-core" }
clinrand-package = { path = "../clinrand-package" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
