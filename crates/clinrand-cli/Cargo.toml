[package]
name = "clinrand-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for ClinRand"
publish = false

[[bin]]
name = "clinrand"
path = "src/main.rs"

[dependencies]
clinrand-core = { path = "../clinrand-core" }
clinrand-package = { path = "../clinrand-package" }
clap = { version = "=4.5.45", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
serde_json = "=1.0.151"
