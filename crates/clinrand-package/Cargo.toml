[package]
name = "clinrand-package"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ClinRand output package reading, writing, hashing, and reports"
publish = false

[dependencies]
clinrand-core = { path = "../clinrand-core" }
# Deserialize manifest.unblinded.json and embedded StudyConfig. Exact pin: serde surface.
serde = { version = "=1.0.229", features = ["derive"] }
# Canonical JSON of StudyConfig for config_sha256 (plan §6.4). Exact pin: hash surface.
serde_json = "=1.0.151"
# SHA-256 of canonical config UTF-8 bytes (plan §6.4). Exact pin: hash surface.
sha2 = "=0.10.9"

[dev-dependencies]
# Isolated temp dirs for write_package integration tests only. Exact pin: lock surface.
tempfile = "=3.27.0"
