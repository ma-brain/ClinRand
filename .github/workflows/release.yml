name: Release

# Tagged release workflow (plan §12 Phase 8). Builds macOS (both
# architectures), Windows NSIS, and Linux .deb/AppImage installers, attaches
# them to a GitHub Release for the pushed tag, and publishes a SHA256SUMS.txt
# a downloader can check with `sha256sum -c`.
#
# Installers are UNSIGNED — no Apple notarization, no Windows Authenticode
# certificate (docs/decisions/0009-unsigned-release-installers.md). This is
# a deliberate scope decision, not an oversight.
#
# workflow_dispatch lets this be exercised without cutting a real tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows
            os: windows-latest
            rust-target: ""
            args: ""
          - name: linux
            os: ubuntu-22.04
            rust-target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "ClinRand ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # No updater plugin is compiled in (AGENTS.md §4 prohibition 4) —
          # never let this action attach updater artifacts or signatures.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  finalize-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --dir dist

      - name: Compute SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          gh release edit "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --draft=false
