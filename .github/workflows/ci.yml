name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install qc.R R dependencies
        shell: bash
        run: Rscript -e "install.packages(c('jsonlite', 'digest'), repos='https://cloud.r-project.org')"
      - name: Lint
        run: just lint
      - name: Test
        run: just test

  desktop:
    # Desktop Tauri host is its own workspace (outside the engine matrix). We
    # build the frontend and `cargo check` the host on ubuntu only; a full
    # GUI build/E2E on all three OSes is manual (see apps/desktop/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            wget
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify no network/shell/process/updater capability
        shell: bash
        run: |
          # Fail if any http/shell/process/updater permission identifier appears
          # in the capability files. Targets permission strings ("http:...") —
          # not the $schema URL or the devUrl in tauri.conf.json.
          if grep -rnE '"(http|shell|process|updater):' apps/desktop/src-tauri/capabilities; then
            echo "::error::Forbidden capability permission identifier found in capabilities/" >&2
            exit 1
          fi
          echo "No forbidden capability permission identifiers found."
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build frontend (produces ../build for the Tauri context)
        working-directory: apps/desktop
        run: npm run build
      - name: cargo check (Tauri host)
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test (command-flow integration)
        working-directory: apps/desktop/src-tauri
        run: cargo test
