name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install qc.R R dependencies
        shell: bash
        run: Rscript -e "install.packages(c('jsonlite', 'digest'), repos='https://cloud.r-project.org')"
      - name: Lint
        run: just lint
      - name: Test
        run: just test
